site_name: Elan Ding
site_url: https://elan-elan.github.io/
site_description: Personal website and research notes from Elan Ding.

theme:
  name: simple-blog

nav:
  - Home: index.md
  - CVPR 2026: blog/cvpr2026.md
  - PyTriton LoRA Memory: blog/triton-memory.md

not_in_nav: |
  blog/cvpr2026/3d-geometry.md
  blog/cvpr2026/diffusion-solvers.md
  blog/cvpr2026/geospatial-active-perception.md
  blog/cvpr2026/tokenization-structured-output.md
  blog/cvpr2026/vlm-reliability.md

plugins:
  - search

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: false
      guess_lang: false
      linenums: false
      noclasses: false
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/blog.css

extra_javascript:
  - javascripts/syntax-highlight.js?v=20260730
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/cvpr2026-stats.js
